services:
  crowdclaw:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/crowdclaw.sqlite
      WORKSPACE_ROOT: /data/workspaces
      HOME: /data/home
    ports:
      - "3000:3000"
    volumes:
      - crowdclaw-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health/ready'); process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  crowdclaw-data:
